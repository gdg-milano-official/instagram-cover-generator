services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8090:8080"
    # docker compose legge .env da solo; senza chiave l'app parte lo stesso
    environment:
      AI_ENDPOINT: ${AI_ENDPOINT:-${AZURE_AI_FOUNDRY_ENDPOINT:-}}
      AI_API_KEY: ${AI_API_KEY:-${AZURE_AI_FOUNDRY_API_KEY:-}}
      AI_MODEL: ${AI_MODEL:-${AZURE_AI_FOUNDRY_MODEL:-}}
